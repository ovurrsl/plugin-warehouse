# CodeQL is free on public repositories. It is worth having here for one
# specific reason rather than as a box to tick: this package is installed
# directly from git into someone else's editor build, so anything it does at
# module scope runs in their app.
name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - CHANGELOG.md
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a rule added after a commit still finds it.
    - cron: '17 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4.37.3
        with:
          languages: javascript-typescript
          # `security-and-quality` over the default `security-extended`: this is
          # a small package where the quality rules are signal, not noise.
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4.37.3

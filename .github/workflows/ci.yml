# Runs once this package is extracted to its own repository. GitHub only reads
# workflows from a repository root, so this file is inert while the package
# lives inside the editor monorepo — it travels with the extraction so the
# standalone repo has CI from its first commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - run: bun run check-types
      - run: bun test

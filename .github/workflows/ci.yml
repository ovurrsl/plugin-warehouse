# Types, lint and tests on every push and pull request.
#
# `paths-ignore` keeps the README automation from bouncing back here: that
# workflow commits README.md and CHANGELOG.md, and while a GITHUB_TOKEN commit
# cannot trigger a new run anyway, the ignore states the intent rather than
# relying on that one rule holding forever.
#
# Third-party actions are pinned to a full commit SHA, not a tag. A tag is
# mutable — whoever controls the action's repository can move it — so a version
# pin is a statement of trust in an account, where a SHA is a statement about
# code. First-party `actions/*` are pinned by major, which is GitHub's own
# published guidance for repositories it owns. Renovate/Dependabot both
# understand the `SHA # tag` form and will bump it.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - CHANGELOG.md
  pull_request:
    paths-ignore:
      - README.md
      - CHANGELOG.md

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.0

      - run: bun install --frozen-lockfile

      # Types first: a type error explains a test failure, where the reverse
      # order spends a run working out that the test was never the problem.
      - name: Types
        run: bun run check-types

      # `biome ci` is the non-writing form — it fails on anything `--write`
      # would have changed, which is what a check should do.
      - name: Lint and format
        run: bunx biome ci .

      - name: Tests
        run: bun test
